<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f59e0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>個人平台</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=26">
</head>
<body>

<!-- 頂部 -->
<header>
  <h1>個人平台 <small style="font-size:.7rem;color:var(--text2);font-weight:400" id="verTag">v27</small></h1>
</header>

<!-- 語音辨識結果（浮動列，貼齊底部導航上方） -->
<div id="voiceResult" class="hidden">
  <p id="voiceText"></p>
  <div class="category-select">
    <button id="saveVoice">儲存</button>
    <button id="cancelVoice">取消</button>
  </div>
</div>

<!-- 主要內容區（JS 動態產生） -->
<main id="main"></main>

<!-- 養成好習慣（iframe 內嵌，保留底部導航） -->
<div id="dashFrame" class="hidden">
  <iframe id="dashIframe" title="養成好習慣" allow="clipboard-write"></iframe>
</div>

<!-- 底部導航（JS 動態產生） -->
<nav id="nav"></nav>

<script src="app.js?v=27"></script>
</body>
</html>
